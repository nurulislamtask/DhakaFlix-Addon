<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GooWatch Add-on Store</title>
<meta name="description" content="One-click install of add-ons into GooWatch, straight from GitHub.">
<style>
  :root{--bg:#09090d;--card:#13131a;--line:#24242f;--text:#f2f2f5;--mute:#9a9aab;--acc:#f5b400;--acc-ink:#1a1300}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(1200px 500px at 50% -10%,#1c1a10,transparent),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 64px}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--acc)}
  a{color:inherit}
  .gh{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:999px}
  .gh:hover{color:var(--text);border-color:#3a3a4a}
  .hero{padding:40px 0 28px;text-align:center}
  .hero h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 12px;letter-spacing:-1px}
  .hero p{color:var(--mute);max-width:560px;margin:0 auto}
  .grid{display:grid;gap:14px;margin-top:28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .ico{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#f5b400,#c05a00);display:grid;place-items:center;font-weight:800;color:var(--acc-ink);font-size:22px;flex:none}
  .info{flex:1;min-width:200px}
  .info h3{margin:0;font-size:18px}.info p{margin:2px 0 6px;color:var(--mute);font-size:14px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
  .tags span{border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .act{display:flex;gap:8px;flex-wrap:wrap}
  button,.btn{font:inherit;cursor:pointer;border-radius:10px;padding:10px 18px;border:1px solid var(--line);background:#1b1b25;color:var(--text);text-decoration:none;display:inline-block}
  .primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
  .primary:hover{filter:brightness(1.08)}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:40px 0 12px}
  .dl{display:flex;gap:10px;flex-wrap:wrap}
  .hint{margin-top:10px;font-size:14px;color:var(--mute);display:none}
  .hint.on{display:block}
  code{background:#1b1b25;border:1px solid var(--line);padding:2px 8px;border-radius:6px;word-break:break-all;font-size:13px}
  .meta{font-size:12px;color:var(--mute)}
  .err{color:#ff8a8a;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Goo<b>Watch</b> <span style="color:var(--mute);font-weight:500;font-size:15px">Add-on Store</span></div>
    <a class="gh" id="ghlink" href="#" target="_blank" rel="noopener">GitHub</a>
  </header>

  <section class="hero">
    <h1>Install add-ons in one click</h1>
    <p>Press <b>Install</b> and GooWatch opens and adds the extension for you. The list is read live from GitHub, so new add-ons appear here as soon as you push them.</p>
  </section>

  <div id="list" class="grid"><div class="card">Loading add-ons…</div></div>

  <h2>Get GooWatch</h2>
  <div id="dl" class="dl"><span class="meta">Loading latest release…</span></div>
</div>

<script>
// ===== set these two to your GitHub =====
var GH_USER = 'nurulislamtask';
var APP_REPO = 'GooWatch';                 // repo that holds the GooWatch app releases
var ADDONS_URL = 'https://raw.githubusercontent.com/nurulislamtask/DhakaFlix-Addon/main/public/addons.json';
// =========================================

var $ = function (id) { return document.getElementById(id); };
$('ghlink').href = 'https://github.com/' + GH_USER;
$('ghlink').textContent = '@' + GH_USER;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function manifestOf(a){ return !a.manifest || a.manifest === 'self' ? location.origin + '/manifest.json' : a.manifest; }

function install(a, hintEl){
  var url = manifestOf(a);
  // GooWatch deep link: goowatch://install?url=<manifest>
  var link = 'goowatch://install?url=' + encodeURIComponent(url);
  var left = false;
  function onBlur(){ left = true; }
  window.addEventListener('blur', onBlur, { once: true });
  location.href = link;
  setTimeout(function(){
    window.removeEventListener('blur', onBlur);
    if (!left) {
      hintEl.classList.add('on');
      hintEl.innerHTML = 'GooWatch did not open? Install GooWatch first (below), then press Install again. Or in GooWatch go to <b>Settings → Extensions</b> and paste: <code>' + esc(url) + '</code>';
    }
  }, 1800);
}

function render(list){
  var box = $('list'); box.innerHTML = '';
  list.forEach(function(a){
    var el = document.createElement('div'); el.className = 'card';
    el.innerHTML =
      '<div class="ico">' + esc((a.name || '?').charAt(0)) + '</div>' +
      '<div class="info"><h3>' + esc(a.name) + '</h3><p>' + esc(a.description) + '</p>' +
      '<div class="tags">' + (a.types || []).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') + '<span class="repo-meta"></span></div></div>' +
      '<div class="act"><button class="primary">Install</button><button class="copy">Copy address</button>' +
      (a.repo ? '<a class="btn" target="_blank" rel="noopener" href="https://github.com/' + esc(a.repo) + '">Source</a>' : '') + '</div>' +
      '<div class="hint" style="flex-basis:100%"></div>';
    var hint = el.querySelector('.hint');
    el.querySelector('.primary').onclick = function(){ install(a, hint); };
    el.querySelector('.copy').onclick = function(){
      var b = this; var u = manifestOf(a);
      (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function(){ b.textContent = 'Copied ✓'; setTimeout(function(){ b.textContent = 'Copy address'; }, 1500); }, function(){ hint.classList.add('on'); hint.innerHTML = 'Address: <code>' + esc(u) + '</code>'; });
    };
    box.appendChild(el);
    if (a.repo) fetch('https://api.github.com/repos/' + a.repo).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if (!j) return;
      el.querySelector('.repo-meta').textContent = '★ ' + j.stargazers_count + ' · updated ' + new Date(j.pushed_at).toLocaleDateString();
    }).catch(function(){});
  });
}

// Add-on list: live from GitHub, falls back to the copy bundled with this site.
fetch(ADDONS_URL, { cache: 'no-store' }).then(function(r){ if (!r.ok) throw 0; return r.json(); })
  .catch(function(){ return fetch('/addons.json').then(function(r){ return r.json(); }); })
  .then(render)
  .catch(function(){ $('list').innerHTML = '<div class="card err">Could not load the add-on list.</div>'; });

// Latest GooWatch app release from GitHub
fetch('https://api.github.com/repos/' + GH_USER + '/' + APP_REPO + '/releases/latest').then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(rel){
  var assets = (rel.assets || []).filter(function(x){ return /\.(exe|apk)$/i.test(x.name); });
  if (!assets.length) throw 0;
  $('dl').innerHTML = assets.map(function(x){
    var win = /\.exe$/i.test(x.name);
    return '<a class="btn' + (win ? ' primary' : '') + '" href="' + esc(x.browser_download_url) + '">' + (win ? 'Download for Windows' : 'Download for Android') + ' <span class="meta" style="color:inherit;opacity:.7">' + esc(rel.tag_name || '') + '</span></a>';
  }).join('');
}).catch(function(){
  $('dl').innerHTML = '<a class="btn primary" target="_blank" rel="noopener" href="https://github.com/' + GH_USER + '/' + APP_REPO + '/releases">Open GooWatch releases</a>';
});
</script>
</body>
</html>
